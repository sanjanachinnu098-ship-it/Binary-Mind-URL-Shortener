<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Mind - URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🔗 Binary Mind</h1>
        <h2>URL Shortener</h2>

        <p>Convert your long URLs into short links!</p>

        <input
            type="url"
            id="longUrl"
            placeholder="Paste your long URL here"
        >

        <button onclick="shortenUrl()">Shorten URL</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
